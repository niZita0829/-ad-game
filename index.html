<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile RPG Idle</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0f2a;
  color:white;
  font-family:Arial;
}

#app{
  width:320px;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:15px;
  text-align:center;
}

button{
  margin:6px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

#battleBtn{background:#4cafef;color:white;}
#gachaBtn{background:#ff4d6d;color:white;}
#healBtn{background:#ffd166;}

.bar{
  width:100%;
  height:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

.fill{
  height:100%;
  width:100%;
  background:red;
  transition:0.2s;
}

#log{
  margin-top:10px;
  font-size:13px;
  color:#aaa;
  height:40px;
}
</style>
</head>

<body>

<div id="app">
<h2>⚔️ Idle RPG Mobile ⚔️</h2>

<div>💎 Gems: <span id="gems">0</span></div>
<div>❤️ HP: <span id="hp">100</span>/100</div>
<div>👹 Boss HP</div>

<div class="bar">
  <div class="fill" id="bossHp"></div>
</div>

<button id="battleBtn" onclick="battle()">BATTLE</button>
<button id="gachaBtn" onclick="gacha()">GACHA (10)</button>
<button id="healBtn" onclick="heal()">HEAL (5)</button>

<div id="log"></div>
</div>

<script>

let gems = 0;
let hp = 100;

let bossMax = 120;
let bossHp = bossMax;

let atk = 8;
let healCount = 3;

const items = [
  {name:"Knight Sword", atk:8},
  {name:"Holy Blade", atk:15},
  {name:"Dragon Fang", atk:25},
  {name:"DIVINE EX 🔥", atk:50}
];

function update(){
  document.getElementById("gems").innerText = gems;
  document.getElementById("hp").innerText = hp;
  document.getElementById("bossHp").style.width = (bossHp/bossMax*100)+"%";
}

function battle(){

  if(hp <= 0){
    log("You are defeated... wait for heal");
    return;
  }

  bossHp -= atk;
  gems += 2;

  // boss attack
  hp -= Math.floor(Math.random()*10);

  if(bossHp <= 0){
    log("🏆 Boss cleared! Reward +30 gems");
    gems += 30;
    nextBoss();
  }

  if(hp <= 0){
    hp = 0;
    log("💀 You lost! Use HEAL");
  }

  update();
}

function gacha(){
  if(gems < 10){
    log("Not enough gems");
    return;
  }

  gems -= 10;

  const item = items[Math.floor(Math.random()*items.length)];
  atk = item.atk;

  log("🎰 Got: " + item.name + " ATK " + item.atk);

  update();
}

function heal(){
  if(healCount <= 0){
    log("No heals left today");
    return;
  }

  hp = 100;
  healCount--;

  log("❤️ Healed!");
  update();
}

function nextBoss(){
  bossMax += 50;
  bossHp = bossMax;
}

function log(t){
  document.getElementById("log").innerText = t;
}

update();

</script>

</body>
</html>
