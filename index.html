<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Mario Complete</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87CEEB;
  font-family:Arial;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ワールド（カメラで動かす） */
#world{
  position:absolute;
  width:3000px;
  height:100vh;
}

/* プレイヤー */
#player{
  position:absolute;
  bottom:80px;
  left:100px;
  width:40px;
  height:40px;
  background:red;
  border-radius:5px;
}

/* 地面 */
.ground{
  position:absolute;
  bottom:0;
  width:3000px;
  height:80px;
  background:green;
}

/* 敵 */
.enemy{
  position:absolute;
  bottom:80px;
  width:40px;
  height:40px;
  background:black;
}

/* コイン */
.coin{
  position:absolute;
  bottom:140px;
  width:20px;
  height:20px;
  background:gold;
  border-radius:50%;
}

/* ゴール */
#goal{
  position:absolute;
  bottom:80px;
  left:2800px;
  width:40px;
  height:80px;
  background:yellow;
}

/* UI */
#ui{
  position:fixed;
  top:10px;
  left:10px;
  color:white;
  text-shadow:1px 1px 2px black;
}
</style>
</head>

<body>

<div id="game">

<div id="ui">
Score: <span id="score">0</span> |
Coins: <span id="coins">0</span>
</div>

<div id="world">

<div id="player"></div>

<div class="ground"></div>

<!-- 敵 -->
<div class="enemy" style="left:600px;"></div>
<div class="enemy" style="left:1000px;"></div>
<div class="enemy" style="left:1600px;"></div>

<!-- コイン -->
<div class="coin" style="left:500px;"></div>
<div class="coin" style="left:900px;"></div>
<div class="coin" style="left:1300px;"></div>
<div class="coin" style="left:2000px;"></div>

<div id="goal"></div>

</div>

</div>

<script>

let world = document.getElementById("world");
let player = document.getElementById("player");

let score = 0;
let coins = 0;

// プレイヤー状態
let y = 0;
let v = 0;
let jumping = false;

// カメラ位置
let cameraX = 0;

// 操作
document.body.addEventListener("touchstart", jump);
document.body.addEventListener("click", jump);

function jump(){
  if(jumping) return;
  jumping = true;
  v = 16;
}

function loop(){

  let enemies = document.querySelectorAll(".enemy");
  let coinEls = document.querySelectorAll(".coin");
  let goal = document.getElementById("goal");

  // ジャンプ
  if(jumping){
    y += v;
    v -= 1;

    if(y <= 0){
      y = 0;
      jumping = false;
    }

    player.style.bottom = (80 + y) + "px";
  }

  // スクロール（カメラ）
  cameraX += 3;
  world.style.transform = `translateX(${-cameraX}px)`;

  let px = cameraX + 100;

  // 敵処理
  enemies.forEach(e=>{
    let ex = parseInt(e.style.left);

    // 当たり判定
    if(Math.abs(ex - px) < 30 && y < 20){
      score = 0;
    }
  });

  // コイン取得
  coinEls.forEach(c=>{
    let cx = parseInt(c.style.left);

    if(Math.abs(cx - px) < 30 && !c.classList.contains("get")){
      c.classList.add("get");
      c.style.display = "none";
      coins++;
      score += 10;
    }
  });

  // ゴール
  let gx = goal.offsetLeft;
  if(gx - cameraX < 100){
    score += 50;
    alert("CLEAR!");
    location.reload();
  }

  score++;

  document.getElementById("score").innerText = score;
  document.getElementById("coins").innerText = coins;

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
