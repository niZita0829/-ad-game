<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Mario Style Game</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87CEEB;
}

/* 横画面前提 */
#game {
  position:relative;
  width:100vw;
  height:100vh;
}

/* プレイヤー */
#player{
  position:absolute;
  bottom:80px;
  left:80px;
  width:40px;
  height:40px;
  background:red;
  border-radius:5px;
}

/* 地面 */
#ground{
  position:absolute;
  bottom:0;
  width:200%;
  height:80px;
  background:green;
}

/* 敵 */
.enemy{
  position:absolute;
  bottom:80px;
  width:40px;
  height:40px;
  background:black;
}

/* ゴール */
#goal{
  position:absolute;
  bottom:80px;
  right:100px;
  width:40px;
  height:80px;
  background:gold;
}

/* UI */
#ui{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-size:18px;
  text-shadow:1px 1px 2px black;
}
</style>
</head>

<body>

<div id="game">

<div id="ui">Score: <span id="score">0</span></div>

<div id="player"></div>
<div id="ground"></div>
<div id="goal"></div>

<div class="enemy" style="left:300px;"></div>
<div class="enemy" style="left:600px;"></div>
<div class="enemy" style="left:900px;"></div>

</div>

<script>

let player = document.getElementById("player");
let score = 0;

let isJumping = false;
let posY = 0;
let velocity = 0;

let enemies = document.querySelectorAll(".enemy");

document.body.addEventListener("touchstart", jump);
document.body.addEventListener("click", jump);

function jump(){
  if(isJumping) return;

  isJumping = true;
  velocity = 15;
}

function gameLoop(){

  // ジャンプ物理
  if(isJumping){
    posY += velocity;
    velocity -= 1;

    if(posY <= 0){
      posY = 0;
      isJumping = false;
    }

    player.style.bottom = (80 + posY) + "px";
  }

  // 敵との当たり判定
  enemies.forEach(e=>{
    let ex = e.offsetLeft;
    let px = player.offsetLeft;

    if(Math.abs(ex - px) < 30 && posY < 30){
      score = 0;
    }
  });

  // ゴール判定
  let goal = document.getElementById("goal");
  if(goal.offsetLeft - player.offsetLeft < 40){
    score += 10;
    goal.style.right = Math.random()*300 + "px";
  }

  document.getElementById("score").innerText = score;

  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
